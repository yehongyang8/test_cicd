name: CI on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Architecture Check
        run: bash scripts/check-architecture.sh

      # 这部分如果很难处理可以省略
      - name: Lint
        run: pnpm lint

      # 这部分如果很难处理可以省略
      - name: Type Check
        run: tsc -b

      - name: Build
        run: pnpm build

      - name: Notify DingTalk
        if: always()
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS_TEXT="构建成功 ✅"
          else
            STATUS_TEXT="构建失败 ❌"
          fi

          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"
          RUN_URL="${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}"

          TITLE="GitHub Actions：${STATUS_TEXT}"
          TEXT="### GitHub Actions：${STATUS_TEXT}\n\n\n\n- **任务：** [${TAG}](${RUN_URL})\n- **状态：** ${STATUS_TEXT}\n- **执行人：** [Started by user ${ACTOR}]"

          curl -sf -X POST "$DINGTALK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"msgtype\":\"markdown\",\"markdown\":{\"title\":\"${TITLE}\",\"text\":\"${TEXT}\"}}"
